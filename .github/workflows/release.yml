name: Build & Publish Native Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the GitHub Release immediately so it's visible even while builds run
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          name: "Kazu ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Kazu ${{ github.ref_name }}

            All your AI chats. One calm window.

            ### Download the right installer for your system:

            | Platform | File | Instructions |
            |---|---|---|
            | **Windows 10 / 11** | `Kazu-Setup-*-Windows-x64.exe` | Double-click — no admin rights needed. Appears in Start Menu & Desktop. |
            | **macOS 12+** | `Kazu-*-macOS.dmg` | Open the `.dmg`, drag Kazu into Applications. |
            | **Ubuntu / Debian Linux** | `kazu_*_amd64.deb` | `sudo apt install ./kazu_*_amd64.deb` |

            > Installers are attached below. Build jobs run on Windows, macOS and Linux runners and attach files automatically.

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies + PyInstaller
        run: uv sync && uv pip install pyinstaller
      - name: Build Windows app bundle
        run: uv run pyinstaller packaging/kazu.spec --noconfirm
      - name: Build Inno Setup installer (.exe)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver -or $ver -eq "main") { $ver = "0.1.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\windows\kazu.iss
      - name: Upload Windows installer to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: packaging/windows/Output/*.exe

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies + PyInstaller
        run: uv sync && uv pip install pyinstaller
      - name: Build Kazu.app
        run: uv run pyinstaller packaging/kazu.spec --noconfirm
      - name: Package DMG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$VER" = "main" ] || [ -z "$VER" ] && VER="0.1.0"
          mkdir -p dmg_stage
          cp -R dist/Kazu.app dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Kazu" -srcfolder dmg_stage -ov -format UDZO "Kazu-${VER}-macOS.dmg"
      - name: Upload macOS DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Kazu-*-macOS.dmg

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies + PyInstaller
        run: uv sync && uv pip install pyinstaller
      - name: Install system Qt/xcb dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libdbus-1-3 libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 libegl1 libxcb1
      - name: Build Linux bundle
        run: uv run pyinstaller packaging/kazu.spec --noconfirm
      - name: Build .deb package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$VER" = "main" ] || [ -z "$VER" ] && VER="0.1.0"
          PKG="deb_build/kazu_${VER}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/kazu" "$PKG/usr/bin" \
                   "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/256x256/apps" \
                   "$PKG/etc/apparmor.d"
          cp -R dist/kazu/* "$PKG/opt/kazu/"
          ln -s /opt/kazu/kazu "$PKG/usr/bin/kazu"
          cp packaging/linux/kazu.desktop "$PKG/usr/share/applications/kazu.desktop"
          cp packaging/icons/kazu-256.png "$PKG/usr/share/icons/hicolor/256x256/apps/kazu.png"
          cp packaging/linux/kazu.apparmor "$PKG/etc/apparmor.d/kazu"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: kazu
          Version: ${VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Goutham K
          Description: Kazu — Multi-agent desktop AI workspace
           Run multiple AI chats side by side in isolated, persistent sessions.
          EOF
          dpkg-deb --build "$PKG"
      - name: Upload Linux .deb to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: deb_build/*.deb
